# Explanatory starting point, not a trusted or certified preset, for
# <policy_dir>/codex/config.toml. Review and adapt it before copying; the copy
# is user-owned. Create it before policy registration, chmod 600 yourself, and
# keep it outside every workspace. Enso validates but never creates, copies,
# chmods, rewrites, upgrades, or repairs the canonical source. This policy uses
# the invocation workspace root, so one policy can serve several workspaces.
#
# Adapt and test it with the installed Codex version. Enso verifies that TOML
# parses and that its launch plumbing is intact; it does not prove that the
# native policy has the intended effect.
#
# Do not set top-level developer_instructions here. It would create a hidden,
# provider-specific layer alongside Codex's native root/workspace AGENTS.md
# discovery; put shared or project guidance in those canonical files instead.

default_permissions = "enso"
approval_policy = "never"

[permissions.enso.filesystem]
":minimal" = "read"

# Grants no write access. Note that a read-only Codex sandbox still permits
# broad reads (system paths and TMPDIR); it is not confined to the workspace,
# so keep secrets out of readable locations. Use "write" only for a staff
# policy, or grant a narrower writable project-data path using the installed
# CLI's current native syntax. A policy that grants writes must keep
# AGENTS.md, CLAUDE.md, .agents, .claude, and skill definitions protected.
[permissions.enso.filesystem.":workspace_roots"]
"." = "read"

[permissions.enso.network]
enabled = false

# Keep secrets out of commands the agent spawns. Adjust this list to the
# credentials used by the installation. This filters only the inherited
# environment; Codex runs commands through a login shell, so a secret exported
# in ~/.zshenv or ~/.zprofile is re-sourced regardless — keep credentials out
# of shell startup files.
[shell_environment_policy]
inherit = "core"

[shell_environment_policy.filters]
"OP_SERVICE_ACCOUNT_TOKEN" = "exclude"
"SLACK_*" = "exclude"
