# Starting point for <policy_dir>/codex/config.toml. chmod 600 and keep it
# outside every workspace. This profile uses the invocation workspace root,
# so one access profile can be reused for several project workspaces.
#
# Adapt and test it with the installed Codex version. Enso verifies that TOML
# parses and that its launch plumbing is intact; it does not prove that the
# native policy has the intended effect.

default_permissions = "enso"
approval_policy = "never"

[permissions.enso.filesystem]
":minimal" = "read"

# Read-only client access to the invocation workspace. Use "write" only for
# a staff profile, or grant a narrower writable project-data path using the
# installed CLI's current native syntax. Keep AGENTS.md, CLAUDE.md, .agents,
# .claude, and skill definitions protected when a broader route trusts them.
[permissions.enso.filesystem.":workspace_roots"]
"." = "read"

[permissions.enso.network]
enabled = false

# Keep secrets out of commands the agent spawns. Adjust this list to the
# credentials used by the installation.
[shell_environment_policy]
inherit = "core"

[shell_environment_policy.filters]
"OP_SERVICE_ACCOUNT_TOKEN" = "exclude"
"SLACK_*" = "exclude"
