<title>{% block title %}enso{% endblock %}</title>
<main id="main-content" hx-history-elt tabindex="-1"
      class="max-w-6xl px-4 py-8 sm:px-6 lg:px-8 lg:py-10">
  {% if flash %}
    <div role="status" class="mb-5 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm
                text-amber-800 dark:border-amber-900/50 dark:bg-amber-900/20 dark:text-amber-300">
      {{ flash }}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
